# Build + test + pluginval (strictness 5) on macOS (universal VST3 + AU), Windows (VST3) and Linux.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-14
            generator: Xcode
            pluginval_zip: pluginval_macOS.zip
            pluginval_bin: pluginval.app/Contents/MacOS/pluginval
          - name: Windows
            os: windows-2022
            generator: Visual Studio 17 2022
            pluginval_zip: pluginval_Windows.zip
            pluginval_bin: pluginval.exe
          - name: Linux
            os: ubuntu-24.04
            generator: Ninja
            pluginval_zip: pluginval_Linux.zip
            pluginval_bin: pluginval

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          targets="--target EVOX_VST3 --target evox_tests --target evox_plugin_tests --target evox_bench"
          if [ "$RUNNER_OS" == "macOS" ]; then targets="$targets --target EVOX_AU"; fi
          cmake --build build --config Release --parallel 4 $targets

      - name: Unit tests (DSP + plugin layer)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: CPU benchmark
        shell: bash
        run: |
          bench=$(find build -type f \( -name evox_bench -o -name evox_bench.exe \) | head -1)
          for a in "" "--os2x" "--worst" "--os2x --worst"; do "$bench" 48000 128 15 $a; done

      - name: pluginval (strictness 5)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval_zip }}"
          unzip -q pluginval.zip -d pluginval
          PV="pluginval/${{ matrix.pluginval_bin }}"
          chmod +x "$PV" || true
          VST3=$(find build -type d -name "EVOX.vst3" | head -1)
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run -a "$PV" --strictness-level 5 --validate-in-process --validate "$VST3"
          else
            "$PV" --strictness-level 5 --validate-in-process --validate "$VST3"
          fi

      - name: auval + pluginval AU (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          AU=$(find build -type d -name "EVOX.component" | head -1)
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$AU" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Evox Ltsd
          pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process \
            --validate ~/Library/Audio/Plug-Ins/Components/EVOX.component

      - name: Verify universal binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BIN=$(find build -path "*EVOX.vst3/Contents/MacOS/EVOX" | head -1)
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "x86_64" && lipo -info "$BIN" | grep -q "arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: EVOX-${{ runner.os }}
          path: |
            build/**/EVOX.vst3
            build/**/EVOX.component
          if-no-files-found: warn
